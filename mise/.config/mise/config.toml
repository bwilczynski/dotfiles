# Global tool versions, on macOS and on Omarchy alike. Claude Code and Codex
# live here rather than in a Brewfile because both release far more often than
# their Homebrew casks follow; mise tracks upstream directly. Language runtimes
# live here too, so Homebrew never carries a second copy; anything a single
# project needs is pinned in that project's own mise.toml instead.
[tools]
# Coding agents
claude = "latest"
codex = "latest"
opencode = "latest"

# Language runtimes
node = "26.12.1"
python = "3.14"
go = "latest"

# CLIs published to a language registry or as release binaries
gh = "latest"
"npm:prettier" = "latest"
"npm:@bitwarden/cli" = "latest"
"aqua:grafana/loki/logcli" = "latest"
# Spelled aqua:modem-dev/hunk because Omarchy installs it under that name and
# its ~/.local/bin/hunk wrapper re-adds this exact entry on every run; any other
# spelling would end up listed twice.
"aqua:modem-dev/hunk" = "latest"
"github:bwilczynski/homelab-cli" = "latest" # hlctl
"github:bwilczynski/unifictl" = "latest"
"github:bwilczynski/synoctl" = "latest"

[settings]
# mise hides releases younger than minimum_release_age by default, a guard
# against compromised upstream releases. My own tools need no such delay; the
# excludes take exact names only, so each one is listed.
minimum_release_age_excludes = [
  "github:bwilczynski/homelab-cli",
  "github:bwilczynski/unifictl",
  "github:bwilczynski/synoctl",
]

[settings.upgrade]
auto_prune = false
