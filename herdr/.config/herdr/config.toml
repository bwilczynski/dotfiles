onboarding = false
# Shared by macOS and Omarchy. Mirrors tmux/.config/tmux/tmux.conf:
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# The terminal supplies the palette; herdr draws on ANSI colours, so this
# follows the current theme on either platform.
name = "terminal"

[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "ctrl+alt+h"
focus_pane_down = "ctrl+alt+j"
focus_pane_up = "ctrl+alt+k"
focus_pane_right = "ctrl+alt+l"

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-hjkl
resize_pane_left = "ctrl+alt+shift+h"
resize_pane_down = "ctrl+alt+shift+j"
resize_pane_up = "ctrl+alt+shift+k"
resize_pane_right = "ctrl+alt+shift+l"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous workspace
rename_pane = "prefix+shift+o"

# Tabs (tmux windows). No Alt-arrow chords: macOS keeps Option-arrows for word
# movement, and Omarchy uses the same prefix bindings so both behave alike.
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = "prefix+p"
next_tab = "prefix+n"
move_tab_previous = "prefix+ctrl+p"
move_tab_next = "prefix+ctrl+n"

# Workspaces (tmux sessions)
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"

[ui]
accent = "blue"

# kill-window and kill-session never ask; automatic-rename names windows
# without prompting
confirm_close = false
prompt_new_tab_name = false

# Single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# No scrollbar column beside the panes
pane_scrollbars = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W'. This is what the
# window manager shows as the window title, and it resolves on the server so
# remote sessions name the remote host.
window_title = "{hostname}: {workspace}"

[ui.toast]
delivery = "system"
