#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Bartłomiej Wilczyński"
email = "me@bwilczynski.com"

[ui]
default-command = "log"
diff-formatter = ["difft", "--color=always", "$left", "$right"]

# Catppuccin Mocha — mirrors jj's default semantic colors with palette hexes
[colors]
"error" = { fg = "#f38ba8", bold = true }
"error_source" = "#eba0ac"
"warning" = { fg = "#f9e2af", bold = true }
"hint" = "#94e2d5"
"error heading" = { fg = "#f38ba8", bold = true }
"warning heading" = { fg = "#f9e2af", bold = true }
"hint heading" = { fg = "#94e2d5", bold = true }

"conflict_description" = "#f9e2af"
"conflict_description difficult" = "#f38ba8"

"commit_id" = "#89b4fa"
"change_id" = "#cba6f7"
"rest" = "#6c7086"
"hidden prefix" = "#6c7086"

"author" = "#f9e2af"
"committer" = "#f9e2af"
"timestamp" = "#94e2d5"
"working_copies" = "#a6e3a1"
"workspace_name" = "#a6e3a1"
"bookmark" = "#cba6f7"
"bookmarks" = "#cba6f7"
"local_bookmarks" = "#cba6f7"
"remote_bookmarks" = "#cba6f7"
"tag" = "#cba6f7"
"tags" = "#cba6f7"
"git_ref" = "#a6e3a1"
"git_refs" = "#a6e3a1"
"git_head" = "#a6e3a1"
"divergent" = "#cba6f7"
"mutable divergent" = "#f38ba8"
"mutable divergent change_id" = "#f38ba8"
"conflict" = "#f38ba8"
"empty" = "#a6e3a1"
"placeholder" = "#f38ba8"
"description placeholder" = "#f9e2af"
"empty description placeholder" = "#a6e3a1"
"separator" = "#6c7086"
"elided" = "#6c7086"
"root" = "#a6e3a1"

# Working copy uses the brighter end of the palette
"working_copy commit_id" = "#b4befe"
"working_copy change_id" = "#f5c2e7"
"working_copy author" = "#f9e2af"
"working_copy committer" = "#f9e2af"
"working_copy timestamp" = "#89dceb"
"working_copy working_copies" = "#a6e3a1"
"working_copy bookmark" = "#f5c2e7"
"working_copy bookmarks" = "#f5c2e7"
